<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="pulso-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="50%" stop-color="#ff7300" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ff2a85" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container (Vice City Midnight) -->
  <rect width="128" height="128" rx="30" fill="#080914" />
  
  <!-- Neon Gradient Border -->
  <rect x="3" y="3" width="122" height="122" rx="27" fill="none" stroke="url(#pulso-gradient)" stroke-width="4" />
  
  <!-- Glowing Heartbeat / Radio Signal Wave -->
  <path 
    d="M 18 64 L 38 64 L 48 34 L 62 94 L 76 46 L 86 78 L 94 64 L 110 64" 
    fill="none" 
    stroke="url(#pulso-gradient)" 
    stroke-width="11" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#glow)"
  />
  
  <!-- Core White Wave Highlight for Crisp Contrast -->
  <path 
    d="M 20 64 L 38 64 L 48 34 L 62 94 L 76 46 L 86 78 L 94 64 L 108 64" 
    fill="none" 
    stroke="#ffffff" 
    stroke-width="4" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- High-frequency Signal Blips -->
  <circle cx="62" cy="18" r="4.5" fill="#00f0ff" />
  <circle cx="62" cy="110" r="4.5" fill="#ff2a85" />
</svg>
